<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Computer Science Department</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="header-logo"><img src="assets/images/Logo-Efrei-Blanc.png" alt="efrei logo"></a>
        <nav>
            <a href="index.html" class="link-dept" data-text="global.navDept">Our Department</a>
            <a href="courses.html" class="link-courses" data-text="global.navCourses">Our Courses</a>
            <a href="teachers.html" class="link-teachers" data-text="global.navTeachers">Our Teachers</a>
            <a href="permanences.html" class="link-permanences" data-text="global.navPermanences">Permanences</a>
            <a href="learning.html" class="link-learning" data-text="global.navLearning">Learning Together</a>
            <a href="projects.html" class="link-projects" data-text="global.navProjects">Our Projects</a>
            <a href="contact.html" class="link-contact" data-text="global.navContact">Contact Us</a>
            <a href="about.html" class="link-about" data-text="global.navAbout">About Us</a>
        </nav>
    </header>

    <!-- Map Section -->
    <div class="map-section">
        <div class="map-placeholder"></div>`r`n    </div>

    <!-- Main Content -->
    <div class="main-content" style="min-height: 50vh;">
        <h1 class="page-main-title" data-text="contact.mainTitle">Contact Us</h1>
        <p style="text-align: center; font-size: 18px; margin-top: 20px; margin-bottom: 40px;" data-text="contact.description">Get in touch with the Computer Science Department.</p>
        
        <form style="max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 20px;" onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();">
            <div>
                <label for="name" style="display: block; margin-bottom: 8px; font-weight: bold;">Name:</label>
                <input type="text" id="name" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: 'Poppins', sans-serif;">
            </div>
            <div>
                <label for="email" style="display: block; margin-bottom: 8px; font-weight: bold;">Email:</label>
                <input type="email" id="email" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: 'Poppins', sans-serif;">
            </div>
            <div>
                <label for="message" style="display: block; margin-bottom: 8px; font-weight: bold;">Message:</label>
                <textarea id="message" rows="5" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: 'Poppins', sans-serif; resize: vertical;"></textarea>
            </div>
            <button type="submit" class="btn-green" style="align-self: center; padding: 12px 40px; font-size: 16px;">Envoyer</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <a href="index.html" class="header-logo"><img src="assets/images/Logo-Efrei-Blanc.png" alt="efrei logo" style="height: 40px;"></a>
            <div class="footer-links">
                <a href="contact.html">Contact Us</a>
                <a href="about.html">About Us</a>
            </div>
        </div>
        <div class="footer-logo-text">Footer</div>
    </footer>

    <script src="js/content.js"></script>
    <script src="js/loader.js"></script>
</body>
</html>
